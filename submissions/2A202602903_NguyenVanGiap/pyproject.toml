[project]
name = "deepweeds-nguyenvangiap"
version = "0.1.0"
description = "DeepWeeds backbone, training and inference lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "timm>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "tqdm>=4.66,<5",
    "fvcore>=0.1.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ipykernel>=6,<8", "jupyterlab>=4,<5"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = [".", "code", "../.."]
